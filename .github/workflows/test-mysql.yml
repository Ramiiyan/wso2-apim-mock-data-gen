name: Test MySQL Setup

# Triggers only when this workflow file itself is changed.
# Used to verify MySQL initialisation works correctly on ubuntu-latest.
on:
  push:
    paths:
      - '.github/workflows/test-mysql.yml'

jobs:
  test-mysql-setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Start MySQL service
        run: sudo /etc/init.d/mysql start

      - name: Create WSO2 databases and user
        run: |
          sudo mysql -uroot -proot << EOF
          CREATE DATABASE IF NOT EXISTS WSO2_APIM_DB CHARACTER SET latin1;
          CREATE DATABASE IF NOT EXISTS WSO2_SHARED_DB CHARACTER SET latin1;
          CREATE USER IF NOT EXISTS 'wso2carbon'@'localhost' IDENTIFIED BY 'wso2carbon';
          GRANT ALL PRIVILEGES ON WSO2_APIM_DB.* TO 'wso2carbon'@'localhost';
          GRANT ALL PRIVILEGES ON WSO2_SHARED_DB.* TO 'wso2carbon'@'localhost';
          FLUSH PRIVILEGES;
          EOF

      - name: Verify databases and user exist
        run: |
          mysql -uwso2carbon -pwso2carbon -e "SHOW DATABASES;"
          mysql -uroot -proot -e "SELECT user, host FROM mysql.user WHERE user='wso2carbon';"
